name: Build and test Windows preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: engine/src/go.sum
      - name: Install Windows cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 unzip
      - name: Build published source with pinned SDKs
        run: bash tools/build_windows.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package unsigned preview and matching source
        shell: bash
        run: >-
          python tools/build_release.py --version 0.1.0-preview.3 --output artifacts/release
          --client artifacts/windows/opennox-hd-texture2x.exe
          --client-sha256 "$(sha256sum artifacts/windows/opennox-hd-texture2x.exe | cut -d' ' -f1)"
          --runtime artifacts/windows --source engine --module-cache "$(go env GOMODCACHE)"
          --build-manifest artifacts/windows/build-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: artifacts/windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-preview
          path: |
            artifacts/release/*.zip
            artifacts/release/*.json
            artifacts/release/*.txt
            artifacts/release/*.md
          if-no-files-found: error
  windows-smoke:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: client
      - name: Load the actual Windows client and bundled DLLs
        shell: pwsh
        run: |
          $client = Join-Path $PWD 'client/opennox-hd-texture2x.exe'
          $process = Start-Process -FilePath $client -ArgumentList '-help' -WindowStyle Hidden -PassThru -RedirectStandardError help.txt
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Client help timed out' }
          if ($process.ExitCode -ne 0) { throw "Client load failed: $($process.ExitCode)" }
          if ((Get-Content help.txt -Raw) -notmatch 'use specified config file') { throw 'Client help output missing' }
      - name: Load the sprite builder
        shell: pwsh
        run: |
          & (Join-Path $PWD 'client/OpenNox-SpriteBuilder.exe') -help 2>&1 | Out-String | Tee-Object -Variable help | Out-Null
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'sprite size multiplier') { throw 'Sprite builder failed to load' }
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release and installer behavior
        run: python -m unittest discover -s tests -v
  renderer:
    runs-on: ubuntu-latest
    env:
      GOARCH: '386'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: engine/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: engine/src/go.sum
      - name: Install 32-bit C runtime and compiler support
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-multilib
      - name: Test input, renderer and sprite generation
        run: go test -mod=readonly ./client/input ./client/noxrender ./cmd/hd-sprites -count=1
