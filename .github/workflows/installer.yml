name: Windows installer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release and installer behavior
        run: python -m unittest discover -s tests -v
  renderer:
    runs-on: ubuntu-latest
    env:
      GOARCH: '386'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      NOX_RENDER_DEBUG: 'true'
    defaults:
      run:
        working-directory: engine/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: engine/src/go.sum
      - name: Install 32-bit C runtime and compiler support
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-multilib
      - name: Test input and renderer
        run: go test -mod=readonly ./client/input ./client/noxrender -count=1
      - name: Compare particle snapshots against pinned upstream
        if: failure()
        run: |
          git clone --quiet https://github.com/opennox/opennox.git "$RUNNER_TEMP/nox-reference"
          git -C "$RUNNER_TEMP/nox-reference" checkout --quiet b184030e76be2b681a7f6d2bcdef52b091d94b9b
          cd "$RUNNER_TEMP/nox-reference/src"
          go test ./client/noxrender -run '^TestDrawParticle$' -count=1 || true
          diff -r client/noxrender/.testOut "$GITHUB_WORKSPACE/engine/src/client/noxrender/.testOut" --exclude='image_*'
