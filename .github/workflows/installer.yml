name: Build and test Windows preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: engine/src/go.sum
      - name: Install Windows cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 unzip
      - name: Build published source with pinned SDKs
        run: bash tools/build_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: artifacts/windows/
          if-no-files-found: error
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release and installer behavior
        run: python -m unittest discover -s tests -v
  renderer:
    runs-on: ubuntu-latest
    env:
      GOARCH: '386'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: engine/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: engine/src/go.sum
      - name: Install 32-bit C runtime and compiler support
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-multilib
      - name: Test input and renderer
        run: go test -mod=readonly ./client/input ./client/noxrender -count=1
